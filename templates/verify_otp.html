<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Email Verification | AI Resume Analyzer</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            min-height: 100vh;
            margin: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at top left,
                    #dbeafe,
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    #ede9fe,
                    transparent 35%
                ),
                #f8fafc;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        .verification-card {

            width: 100%;
            max-width: 460px;

            background: rgba(255, 255, 255, 0.95);

            border-radius: 24px;

            padding: 42px 36px;

            box-shadow:
                0 25px 70px rgba(
                    15,
                    23,
                    42,
                    0.12
                );

            border: 1px solid
                rgba(255, 255, 255, 0.8);

            text-align: center;
        }

        .icon-wrapper {

            width: 82px;
            height: 82px;

            margin: 0 auto 22px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #eef2ff;

            color: #4f46e5;

            font-size: 38px;
        }

        .verification-card h1 {

            font-size: 28px;

            font-weight: 700;

            color: #111827;

            margin-bottom: 10px;
        }

        .subtitle {

            color: #6b7280;

            font-size: 15px;

            line-height: 1.6;

            margin-bottom: 25px;
        }

        .email {

            font-weight: 600;

            color: #4f46e5;

            word-break: break-all;
        }

        .otp-input {

            width: 100%;

            padding: 15px;

            border-radius: 14px;

            border: 1px solid #d1d5db;

            outline: none;

            font-size: 25px;

            font-weight: 700;

            text-align: center;

            letter-spacing: 10px;

            transition: 0.2s;
        }

        .otp-input:focus {

            border-color: #6366f1;

            box-shadow:
                0 0 0 4px
                rgba(99, 102, 241, 0.12);
        }

        .verify-btn {

            width: 100%;

            margin-top: 20px;

            padding: 14px;

            border: none;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    #4f46e5,
                    #7c3aed
                );

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s;
        }

        .verify-btn:hover {

            transform: translateY(-1px);

            box-shadow:
                0 10px 25px
                rgba(79, 70, 229, 0.25);
        }

        .resend-btn {

            margin-top: 18px;

            border: none;

            background: transparent;

            color: #4f46e5;

            font-weight: 600;

            cursor: pointer;
        }

        .resend-btn:hover {

            text-decoration: underline;
        }

        .timer {

            margin-top: 12px;

            font-size: 14px;

            color: #6b7280;
        }

        .back-login {

            display: inline-block;

            margin-top: 25px;

            color: #6b7280;

            text-decoration: none;

            font-size: 14px;
        }

        .back-login:hover {

            color: #4f46e5;
        }

        .alert {

            border-radius: 12px;

            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="verification-card">

    <div class="icon-wrapper">
        ✉
    </div>

    <h1>
        Verify Your Email
    </h1>

    <p class="subtitle">

        We've sent a 6-digit verification code to

        <br>

        <span class="email">
            {{ email }}
        </span>

    </p>


    <!-- FLASH MESSAGES -->

    {% with messages = get_flashed_messages(
        with_categories=true
    ) %}

        {% if messages %}

            {% for category, message in messages %}

                <div
                    class="alert alert-{{
                        'danger'
                        if category == 'danger'
                        else category
                    }}"
                >

                    {{ message }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- VERIFY FORM -->

    <form
        method="POST"
        action="{{ url_for('auth.verify_otp') }}"
    >

        <input
            type="text"
            name="otp"
            class="otp-input"
            maxlength="6"
            minlength="6"
            inputmode="numeric"
            pattern="[0-9]{6}"
            placeholder="000000"
            autocomplete="one-time-code"
            required
        >

        <button
            type="submit"
            class="verify-btn"
        >
            Verify Email
        </button>

    </form>


    <!-- TIMER -->

    <div class="timer">

        OTP expires in

        <strong id="timer">
            05:00
        </strong>

    </div>


    <!-- RESEND -->

    <form
        method="POST"
        action="{{ url_for('auth.resend_otp') }}"
    >

        <button
            type="submit"
            class="resend-btn"
            id="resendButton"
            disabled
        >
            Resend OTP
        </button>

    </form>


    <a
        href="{{ url_for('auth.login') }}"
        class="back-login"
    >
        ← Back to Login
    </a>

</div>


<script>

    let totalSeconds = 5 * 60;

    const timerElement =
        document.getElementById("timer");

    const resendButton =
        document.getElementById("resendButton");


    function updateTimer() {

        const minutes =
            Math.floor(totalSeconds / 60);

        const seconds =
            totalSeconds % 60;

        timerElement.textContent =
            String(minutes).padStart(2, "0")
            + ":"
            + String(seconds).padStart(2, "0");


        if (totalSeconds <= 0) {

            timerElement.textContent =
                "Expired";

            resendButton.disabled = false;

            return;
        }

        totalSeconds--;

        setTimeout(
            updateTimer,
            1000
        );
    }


    updateTimer();

</script>


</body>

</html>
